# Application Configuration
server:
  port: 8443
  servlet:
    context-path: /

spring:
  application:
    name: auth-service

  # Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/Quotation
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: Thukubrian1@2025

  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:myverylongandsecurejwtsecretkeythatisatleast32chars}
  expiration: ${JWT_EXPIRATION:3600000}

# Logging Configuration
logging:
  level:
    com.authservice: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Management endpoints (for health check)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always