<div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-sm">
    <img src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=500" alt="Your Company" class="mx-auto h-10 w-auto" />
    <h2 class="mt-10 text-center text-2xl/9 font-bold tracking-tight text-white">Enter Phone Number and Amount to pay</h2>
  </div>

  <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
    <!-- Error Message -->
    <div *ngIf="showError" class="mb-4 rounded-md bg-red-50 p-4 border border-red-200">
      <div class="flex">
        <div class="ml-3">
          <h3 class="text-sm font-medium text-red-800">{{ errorMessage }}</h3>
        </div>
        <div class="ml-auto pl-3">
          <button (click)="clearError()" class="text-red-400 hover:text-red-600">
            <span class="sr-only">Dismiss</span>
            ✕
          </button>
        </div>
      </div>
    </div>

    <!-- Login Form -->
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="space-y-6">
      <!-- Email Field -->
      <div>
        <label for="phone" class="block text-sm/6 font-medium text-gray-100">Phone Number</label>
        <div class="mt-2">
          <input
            id="phone"
            type="phone"
            name="phone"
            [(ngModel)]="paymentData.phone"
            required
            autocomplete="current-email"
            [disabled]="isLoading"
            (input)="clearError()"
            class="block w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-white outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6 disabled:opacity-50"
            placeholder="Enter your phone number" />
        </div>
      </div>

       <!-- Amount Field -->
      <div>
        <label for="amount" class="block text-sm/6 font-medium text-gray-100">Amount</label>
        <div class="mt-2">
          <input
            id="amount"
            type="amount"
            name="amount"
            [(ngModel)]="paymentData.amount"
            required
            autocomplete="current-email"
            [disabled]="isLoading"
            (input)="clearError()"
            class="block w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-white outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6 disabled:opacity-50"
            placeholder="Enter amount to pay" />
        </div>
      </div>
      <!-- Submit Button -->
      <div>
        <button
          type="submit"
          [disabled]="isLoading || !PaymentData.valid"
          class="flex w-full justify-center rounded-md bg-indigo-500 px-3 py-1.5 text-sm/6 font-semibold text-white hover:bg-indigo-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed">
          <span *ngIf="!isLoading">Pay</span>
          <span *ngIf="isLoading" class="flex items-center">
            <svg class="animate-spin -ml-1 mr-3 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Processing...
          </span>
        </button>
      </div>
    </form>
  </div>
</div>
