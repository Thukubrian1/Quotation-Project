mpesa:
  consumer-key: ${MPESA_CONSUMER_KEY:your-consumer-key}
  consumer-secret: ${MPESA_CONSUMER_SECRET:your-consumer-secret}
  base-url: ${MPESA_BASE_URL:https://sandbox.safaricom.co.ke}
  business-short-code: ${MPESA_BUSINESS_SHORT_CODE:174379}
  passkey: ${MPESA_PASSKEY:your-passkey}
  callback-url: ${MPESA_CALLBACK_URL:https://your-domain.com/api/v1/payments/mpesa/callback}

spring:
  # H2 Database configuration
  datasource:
    url: jdbc:h2:mem:payment_service;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # H2 Console configuration (for development/testing)
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    defer-datasource-initialization: true

  # SQL initialization (optional - for initial data)
  sql:
    init:
      mode: always
      platform: h2

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:your-auth-service-uri}

logging:
  level:
    com.paymentservice: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE