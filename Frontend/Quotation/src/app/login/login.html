<div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-sm">
    <img src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=500" alt="Your Company" class="mx-auto h-10 w-auto" />
    <h2 class="mt-10 text-center text-2xl/9 font-bold tracking-tight text-white">Sign in to your account</h2>
  </div>

  <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
    <!-- Error Message -->
    <div *ngIf="showError" class="mb-4 rounded-md bg-red-50 p-4 border border-red-200">
      <div class="flex">
        <div class="ml-3">
          <h3 class="text-sm font-medium text-red-800">{{ errorMessage }}</h3>
        </div>
        <div class="ml-auto pl-3">
          <button (click)="clearError()" class="text-red-400 hover:text-red-600">
            <span class="sr-only">Dismiss</span>
            ✕
          </button>
        </div>
      </div>
    </div>

    <!-- Login Form -->
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="space-y-6">
      <!-- Email Field -->
      <div>
        <label for="email" class="block text-sm/6 font-medium text-gray-100">Email address</label>
        <div class="mt-2">
          <input 
            id="email" 
            type="email" 
            name="email" 
            [(ngModel)]="loginData.email"
            required 
            autocomplete="current-email" 
            [disabled]="isLoading"
            (input)="clearError()"
            class="block w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-white outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6 disabled:opacity-50" 
            placeholder="Enter your email" />
        </div>
      </div>

      <!-- Password Field -->
      <div>
        <div class="flex items-center justify-between">
          <label for="password" class="block text-sm/6 font-medium text-gray-100">Password</label>
          <div class="text-sm">
            <a href="#" class="font-semibold text-indigo-400 hover:text-indigo-300">Forgot password?</a>
          </div>
        </div>
        <div class="mt-2">
          <input 
            id="password" 
            type="password" 
            name="password" 
            [(ngModel)]="loginData.password"
            required 
            autocomplete="current-password" 
            [disabled]="isLoading"
            (input)="clearError()"
            class="block w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-white outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6 disabled:opacity-50" 
            placeholder="Enter your password" />
        </div>
      </div>

      <!-- Submit Button -->
      <div>
        <button 
          type="submit" 
          [disabled]="isLoading || !loginForm.form.valid"
          class="flex w-full justify-center rounded-md bg-indigo-500 px-3 py-1.5 text-sm/6 font-semibold text-white hover:bg-indigo-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed">
          <span *ngIf="!isLoading">Sign in</span>
          <span *ngIf="isLoading" class="flex items-center">
            <svg class="animate-spin -ml-1 mr-3 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Signing in...
          </span>
        </button>
      </div>
    </form>

    <!-- Register Link -->
    <p class="mt-10 text-center text-sm/6 text-gray-400">
      Not a member?
      <button (click)="goToRegister()" class="font-semibold text-indigo-400 hover:text-indigo-300 underline bg-transparent border-none cursor-pointer">Sign Up</button>
    </p>

    <!-- Test Credentials (for demo - remove in production) -->
    <div class="mt-6 p-3 bg-gray-800 rounded-md border border-gray-600">
      <h4 class="text-xs font-medium text-gray-300 mb-2">Demo Credentials:</h4>
      <div class="text-xs text-gray-400 space-y-1">
        <div>admin@example.com / admin123</div>
        <div>user@example.com / user123</div>
        <div>test@example.com / test123</div>
      </div>
    </div>
  </div>
</div>
