# Payment Service Configuration
server:
  port: 8081

spring:
  application:
    name: payment-service

  profiles:
    active: dev

  # Database Configuration
  datasource:
    url: jdbc:h2:mem:payments;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none # Changed from create-drop to none since we're using schema.sql
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true # Important for H2 with data.sql

  # SQL script initialization
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: false

  # H2 Console Configuration
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
        trace: false

jwt:
  secret: ${JWT_SECRET:myverylongandsecurejwtsecretkeythatisatleast32chars}
  expiration: ${JWT_EXPIRATION:3600000}

# External Service Configuration
external:
  service:
    auth-service:
      base-url: ${AUTH_SERVICE_URL:http://localhost:8443}

    # Service credentials for dynamic token retrieval (if needed)
    service-account:
      username: ${SERVICE_ACCOUNT_USERNAME:service-payment}
      password: ${SERVICE_ACCOUNT_PASSWORD:service-password}

